services:
  postgres:
    image: postgres:16-alpine
    container_name: squat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-squat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-squat}
      POSTGRES_DB: ${POSTGRES_DB:-squat}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - squat_pg_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-squat} -d ${POSTGRES_DB:-squat}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  squat_pg_data:
